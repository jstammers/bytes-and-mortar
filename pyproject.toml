[project]
name = "bytes-and-mortar"
version = "0.2.0"
description = "A project to predict UK property values using Land Registry, EPC, and UK HPI data"
authors = [
    { name = "Jimmy Stammers" },
    { name = "Kyle Jarvis" },
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "polars>=1.0",
    "requests>=2.28",
    "tqdm>=4.64",
    "python-dotenv>=0.5.1",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "responses>=0.23",
    "ruff>=0.11",
    "ty>=0.0.1a6",
]
ml = [
    "scikit-learn>=1.5",
    "perpetual>=1.4",
    "mlflow>=2.13",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
]
notebooks = [
    "marimo>=0.6",
    "pymc>=5.10",
    "arviz>=0.18",
]
app = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
]

[project.scripts]
bytes-and-mortar = "src.data.make_dataset:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: end-to-end tests requiring fixture data in data/test_fixtures/raw/ (generate with: uv run python scripts/create_m19_fixtures.py)",
]

[tool.ty.rules]
# ty is in alpha and lacks stubs for mlflow and other third-party libs.
# These are false positives — suppress until upstream stubs improve.
possibly-missing-attribute = "ignore"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
